name: Grow Contribution Garden

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', 'action.yml', 'test/**', '.github/workflows/garden.yml']

permissions:
  contents: write

concurrency:
  group: contribution-garden
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - name: Generate real contribution garden
        run: npm run generate -- --user "$GARDEN_USER"
        env:
          GARDEN_USER: ${{ vars.GARDEN_USERNAME || github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GARDEN_TOKEN || github.token }}
      - name: Publish SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
